# Giltgrave community server blueprint
#
# This file is the spec. The server is its first instantiation.
# Applied by ../provision/provision.py, which is idempotent: run it as many
# times as you like, it updates in place rather than duplicating.
#
# Everything here is deliberately game-agnostic in structure and Giltgrave-
# specific only in content, so a second game (One Trick) forks this file
# rather than starting over.

meta:
  name: Giltgrave
  slug: giltgrave
  # Left border on every posted embed. Set it to your game's colour.
  accent_color: 0xC9A227

# Fill-in-the-blanks. Anything written as {{name}} below gets replaced.
# This is what makes the blueprint redeployable to the next project instead of
# being a config file for one server: {{game}} survives the move, "Giltgrave"
# does not. The UI turns this block into form fields.
variables:
  game: Giltgrave
  # What the community calls itself. Used in channel topics.
  players: climbers
  # One line describing the game, used in the welcome post.
  tagline: "A tower that remembers the nameless. Climb it, or be forgotten in it."

guild:
  # Community mode. The provisioner enables this for you.
  # Discord requires all three of these before it will accept COMMUNITY.
  community: true
  verification_level: 1        # 1 = verified email required (Community minimum)
  explicit_content_filter: 2   # 2 = scan messages from all members
  default_message_notifications: 1   # 1 = mentions only. Sane default for a game server.
  rules_channel: rules
  public_updates_channel: server-updates
  safety_alerts_channel: mod-log

  # Where Discord posts its own notices. Left unset it picks a channel itself
  # and adds "setup tips" nagging, which looks like clutter you left behind.
  # Join messages are kept on purpose: a small server feels alive when you can
  # see people arrive.
  system_channel: general
  system_channel_flags:
    - suppress_setup_tips
    - suppress_join_stickers
  afk_channel: General Voice
  afk_timeout: 3600
  boost_progress_bar: true

# The panel Discord shows to people opening the invite, before they join.
# Separate from the questions they answer after joining, and it has an endpoint
# despite most guides telling you to set it by hand.
welcome_screen:
  description: "A tower that remembers the nameless. Builds, bugs, and arguments about floor 40."
  channels:
    - channel: start-here
      description: "What this is"
      emoji: "📜"
    - channel: general
      description: "Say hello"
      emoji: "💬"
    - channel: hero-showcase
      description: "Show a pull"
      emoji: "🗡️"
    - channel: bug-reports
      description: "Report a bug"
      emoji: "🐛"
    - channel: announcements
      description: "Release news"
      emoji: "📣"

# ---------------------------------------------------------------------------
# Roles
#
# Listed highest-first. The provisioner sets positions to match this order,
# clamped below its own integration role.
# ---------------------------------------------------------------------------
roles:
  # Discord ownership is a property of the server, not a role: you already hold
  # every permission and the crown next to your name. This exists only so the
  # member list shows it, which is why it grants nothing.
  - name: Owner
    note: "Cosmetic. Server ownership is not a role, so this grants nothing."
    color: 0xE0B341
    hoist: true
    mentionable: false
    permissions: []

  - name: Dev
    color: 0xC9A227
    hoist: true
    mentionable: true
    permissions: [ADMINISTRATOR]

  # Full server management without being a developer. Deliberately NOT
  # Administrator: that one permission bypasses every channel restriction and
  # cannot be undone by a channel override, so it stays on Dev alone.
  - name: Admin
    note: "Runs the server. Everything a Mod can do, plus channels, roles and invites."
    color: 0xB5533C
    hoist: true
    mentionable: true
    permissions:
      - VIEW_CHANNEL
      - SEND_MESSAGES
      - SEND_MESSAGES_IN_THREADS
      - CREATE_PUBLIC_THREADS
      - EMBED_LINKS
      - ATTACH_FILES
      - ADD_REACTIONS
      - READ_MESSAGE_HISTORY
      - MENTION_EVERYONE
      - MANAGE_MESSAGES
      - MANAGE_THREADS
      - MANAGE_NICKNAMES
      - MANAGE_CHANNELS
      - MANAGE_ROLES
      - MANAGE_GUILD
      - MANAGE_EVENTS
      - CREATE_INSTANT_INVITE
      - KICK_MEMBERS
      - BAN_MEMBERS
      - MODERATE_MEMBERS
      - VIEW_AUDIT_LOG
      - CONNECT
      - SPEAK
      - MUTE_MEMBERS
      - MOVE_MEMBERS

  - name: Mod
    color: 0x7A5CA8
    hoist: true
    mentionable: true
    permissions:
      - VIEW_CHANNEL
      - SEND_MESSAGES
      - SEND_MESSAGES_IN_THREADS
      - CREATE_PUBLIC_THREADS
      - EMBED_LINKS
      - ATTACH_FILES
      - ADD_REACTIONS
      - READ_MESSAGE_HISTORY
      - MENTION_EVERYONE
      - MANAGE_MESSAGES
      - MANAGE_THREADS
      - MANAGE_NICKNAMES
      - KICK_MEMBERS
      - BAN_MEMBERS
      - MODERATE_MEMBERS
      - VIEW_AUDIT_LOG
      - CONNECT
      - SPEAK
      - MUTE_MEMBERS
      - MOVE_MEMBERS

  # Streamers and video makers who join. Worth its own role because the build
  # plan's outreach track needs a way to reach exactly these people, and a
  # mentionable role is the only compliant way to do that. Discord prohibits
  # unsolicited DMs.
  - name: Content Creator
    note: "Streamers and video makers. Mentionable, so you can reach them without DMs."
    color: 0xD07B4F
    hoist: false
    mentionable: true
    permissions: []

  # Scarcity mechanic. Granted by hand to everyone who joins before the public
  # announcement, then never granted again. Costs nothing, people care.
  - name: Founding Member
    note: "Scarcity mechanic. Grant to everyone who joins before you announce publicly, then never again."
    color: 0xB0902A
    hoist: true
    mentionable: false
    permissions: []

  - name: Veteran
    color: 0x9C4A3C
    hoist: false
    mentionable: false
    permissions: []

  - name: Playtester
    note: "Gates #playtest-lounge. Turn both off together if you are not running playtests."
    color: 0x3F7A6B
    hoist: true
    mentionable: true
    permissions: []

  # The compliance rail. Every proactive reach routes through this role
  # instead of a DM. Granted by the onboarding prompt below.
  - name: Ping Me For Playtests
    required: true
    required_reason: "Discord prohibits unsolicited DMs. An opt-in role is the only compliant way to reach people."
    note: "Every announcement that would otherwise want to be a DM mentions this role instead."
    color: 0x000000
    hoist: false
    mentionable: true
    permissions: []

  # Interest roles, granted by onboarding answers.
  - name: Tower Climber
    color: 0x000000
    hoist: false
    mentionable: true
    permissions: []

  - name: Guild Seeker
    color: 0x000000
    hoist: false
    mentionable: true
    permissions: []

  - name: Bug Hunter
    color: 0x000000
    hoist: false
    mentionable: true
    permissions: []

  - name: Lore Reader
    color: 0x000000
    hoist: false
    mentionable: true
    permissions: []

  # Attribution roles, held for about a second each.
  #
  # Discord rejects any onboarding answer that grants neither a role nor a
  # channel, so "How did you find us?" cannot be a pure survey. The answer has
  # to grant something. But nothing says it has to keep it: these are marked
  # ephemeral, so Steward writes the answer into the ledger and takes the role
  # straight back off. Nobody ends up wearing "Found via Reddit" on their
  # profile, and the number still lands somewhere you can query.
  #
  # REQUIRES STEWARD TO BE RUNNING. If the ledger bot is off, these roles pile
  # up on members exactly as if they were permanent, and Steward sweeps them on
  # its next start. If you are not going to run Steward, delete this question
  # rather than leaving it half-working.
  - name: "Found via Steam"
    ephemeral: true
    color: 0x000000
    hoist: false
    mentionable: false
    permissions: []
    note: "Removed automatically once Steward records the answer. Never stays on anyone."

  - name: "Found via a Friend"
    ephemeral: true
    color: 0x000000
    hoist: false
    mentionable: false
    permissions: []
    note: "Removed automatically once Steward records the answer. Never stays on anyone."

  - name: "Found via a Creator"
    ephemeral: true
    color: 0x000000
    hoist: false
    mentionable: false
    permissions: []
    note: "Removed automatically once Steward records the answer. Never stays on anyone."

  - name: "Found via Reddit"
    ephemeral: true
    color: 0x000000
    hoist: false
    mentionable: false
    permissions: []
    note: "Removed automatically once Steward records the answer. Never stays on anyone."

  - name: "Found via Another Server"
    ephemeral: true
    color: 0x000000
    hoist: false
    mentionable: false
    permissions: []
    note: "Removed automatically once Steward records the answer. Never stays on anyone."

  - name: "Found via Elsewhere"
    ephemeral: true
    color: 0x000000
    hoist: false
    mentionable: false
    permissions: []
    note: "Removed automatically once Steward records the answer. Never stays on anyone."

# ---------------------------------------------------------------------------
# Permission overwrite presets, referenced by channels below.
#
# "everyone" is a magic name meaning @everyone (the role whose id is the
# guild id). Names otherwise refer to roles declared above.
# ---------------------------------------------------------------------------
overwrite_presets:

  # Anyone can read, only staff can post. Threads off.
  readonly:
    - role: everyone
      deny: [SEND_MESSAGES, CREATE_PUBLIC_THREADS, CREATE_PRIVATE_THREADS, SEND_MESSAGES_IN_THREADS, ADD_REACTIONS]
      allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY]
    - role: Dev
      allow: [SEND_MESSAGES, MENTION_EVERYONE, CREATE_PUBLIC_THREADS]
    - role: Admin
      allow: [SEND_MESSAGES, MENTION_EVERYONE, CREATE_PUBLIC_THREADS]
    - role: Mod
      allow: [SEND_MESSAGES, CREATE_PUBLIC_THREADS]

  # Read-only but reactions allowed. Used for announcement channels where a
  # reaction is the only feedback signal you get.
  readonly_reactable:
    - role: everyone
      deny: [SEND_MESSAGES, CREATE_PUBLIC_THREADS, CREATE_PRIVATE_THREADS]
      allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, ADD_REACTIONS, SEND_MESSAGES_IN_THREADS]
    - role: Dev
      allow: [SEND_MESSAGES, MENTION_EVERYONE, CREATE_PUBLIC_THREADS]
    - role: Admin
      allow: [SEND_MESSAGES, MENTION_EVERYONE, CREATE_PUBLIC_THREADS]
    - role: Mod
      allow: [SEND_MESSAGES, CREATE_PUBLIC_THREADS]

  # Fully open. These are the five that satisfy Discord's onboarding rule.
  open:
    - role: everyone
      allow: [VIEW_CHANNEL, SEND_MESSAGES, SEND_MESSAGES_IN_THREADS, CREATE_PUBLIC_THREADS, EMBED_LINKS, ATTACH_FILES, ADD_REACTIONS, READ_MESSAGE_HISTORY, USE_EXTERNAL_EMOJIS, SEND_POLLS]

  # Open but no link embeds for @everyone, which kills the most common
  # low-effort scam vector without needing an AutoMod rule slot.
  open_no_links:
    - role: everyone
      allow: [VIEW_CHANNEL, SEND_MESSAGES, SEND_MESSAGES_IN_THREADS, CREATE_PUBLIC_THREADS, ATTACH_FILES, ADD_REACTIONS, READ_MESSAGE_HISTORY, USE_EXTERNAL_EMOJIS]
      deny: [EMBED_LINKS]

  # Forum: anyone can open a post and reply.
  forum_open:
    - role: everyone
      allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, CREATE_PUBLIC_THREADS, SEND_MESSAGES_IN_THREADS, ADD_REACTIONS, EMBED_LINKS, ATTACH_FILES]
      deny: [SEND_MESSAGES]

  playtester_only:
    - role: everyone
      deny: [VIEW_CHANNEL]
    - role: Playtester
      allow: [VIEW_CHANNEL, SEND_MESSAGES, SEND_MESSAGES_IN_THREADS, CREATE_PUBLIC_THREADS, EMBED_LINKS, ATTACH_FILES, ADD_REACTIONS, READ_MESSAGE_HISTORY]
    - role: Admin
      allow: [VIEW_CHANNEL, SEND_MESSAGES, MENTION_EVERYONE]
    - role: Dev
      allow: [VIEW_CHANNEL, SEND_MESSAGES, MENTION_EVERYONE]
    - role: Mod
      allow: [VIEW_CHANNEL, SEND_MESSAGES]

  staff_only:
    - role: everyone
      deny: [VIEW_CHANNEL]
    - role: Dev
      allow: [VIEW_CHANNEL, SEND_MESSAGES, READ_MESSAGE_HISTORY, EMBED_LINKS, ATTACH_FILES]
    - role: Admin
      allow: [VIEW_CHANNEL, SEND_MESSAGES, READ_MESSAGE_HISTORY, EMBED_LINKS, ATTACH_FILES]
    - role: Mod
      allow: [VIEW_CHANNEL, SEND_MESSAGES, READ_MESSAGE_HISTORY, EMBED_LINKS, ATTACH_FILES]

  voice_open:
    - role: everyone
      allow: [VIEW_CHANNEL, CONNECT, SPEAK, USE_VAD, READ_MESSAGE_HISTORY, SEND_MESSAGES]

# ---------------------------------------------------------------------------
# Channels
#
# Order within a category is preserved. Forum and announcement channels are
# created after Community mode is enabled, because Discord rejects them before.
# ---------------------------------------------------------------------------
categories:

  - name: INFO
    channels:
      - name: start-here
        type: text
        overwrites: readonly
        # Posted and pinned automatically. Edit the file and re-run.
        content_file: content/start-here.md
        pin: true
        topic: "What {{game}} is, how the server works, where to go first."

      - name: rules
        type: text
        overwrites: readonly
        content_file: content/rules.md
        pin: true
        required: true
        required_when: community
        required_reason: "Community mode will not turn on without a rules channel."
        topic: "Read these. Rules Screening shows them to every new member before they can post."

      - name: announcements
        type: announcement
        overwrites: readonly_reactable
        topic: "Releases, playtests, events. Follow this channel to mirror it into your own server."

      - name: patch-notes
        type: announcement
        overwrites: readonly_reactable
        topic: "Build notes, every version. Separate from announcements on purpose: people who want builds do not want events."

  - name: PLAY
    channels:
      - name: general
        type: text
        overwrites: open
        default: true
        topic: "Everything {{game}}."

      - name: screenshots
        type: text
        overwrites: open
        default: true
        topic: "Post what your run looked like."

      # For a gacha this is the highest-engagement channel in the server.
      - name: hero-showcase
        type: text
        overwrites: open
        default: true
        topic: "Pulls, ascensions, ornament builds. Brag here."

      - name: tower-talk
        type: text
        overwrites: open
        default: true
        topic: "Strategy, floor progression, zone comps, what wall you are stuck on."

      - name: looking-for-guild
        type: text
        overwrites: open
        content_file: content/looking-for-guild.md
        pin: true
        topic: "Recruiting, or looking to be recruited. One post per guild, edit it rather than reposting."

  - name: FEEDBACK
    channels:
      - name: bug-reports
        type: forum
        overwrites: forum_open
        # A forum with no posts reads as broken, and the first person to use it
        # has no example to copy.
        forum_post:
          title: "Read this before posting a bug"
          content_file: content/bug-reports.md
          pin: true
        topic: |
          One bug per post. Include:
          1. Build number (Settings, bottom of the panel)
          2. What you did, step by step
          3. What you expected, what happened instead
          4. A screenshot if it is visual

          Tag your post. Untagged posts get tagged by a mod and that is slower for you.
        default_auto_archive_duration: 10080   # 1 week, not the 3-day default
        default_sort_order: 1                  # 1 = creation date
        default_forum_layout: 1                # 1 = list view
        tags:
          - { name: crash, emoji: "💥" }
          - { name: visual, emoji: "🖼️" }
          - { name: balance, emoji: "⚖️" }
          - { name: multiplayer, emoji: "🌐" }
          - { name: generation, emoji: "🎨" }
          - { name: account, emoji: "🔑" }
          - { name: save-data, emoji: "💾" }
          # Moderated tags: only staff can apply these. This is your triage state.
          - { name: needs-info, emoji: "❓", moderated: true }
          - { name: confirmed, emoji: "✅", moderated: true }
          - { name: fixed, emoji: "🩹", moderated: true }
          - { name: cannot-reproduce, emoji: "🌫️", moderated: true }
          - { name: by-design, emoji: "📐", moderated: true }

      - name: suggestions
        type: forum
        overwrites: forum_open
        forum_post:
          title: "How suggestions work here"
          content_file: content/suggestions.md
          pin: true
        topic: |
          One idea per post. Vote with the 👍 reaction on the first message.
          Read before posting: a duplicate splits the vote and makes your idea
          look less popular than it is.
        default_auto_archive_duration: 10080
        default_reaction_emoji: "👍"
        default_sort_order: 0                  # 0 = latest activity
        tags:
          - { name: gameplay, emoji: "🎲" }
          - { name: heroes, emoji: "🗡️" }
          - { name: tower, emoji: "🗼" }
          - { name: guild, emoji: "🛡️" }
          - { name: ui, emoji: "🪟" }
          - { name: quality-of-life, emoji: "🧹" }
          - { name: under-consideration, emoji: "🤔", moderated: true }
          - { name: planned, emoji: "📌", moderated: true }
          - { name: shipped, emoji: "🚢", moderated: true }
          - { name: not-planned, emoji: "🚫", moderated: true }

      - name: playtest-lounge
        type: text
        overwrites: playtester_only
        content_file: content/playtest-lounge.md
        pin: true
        topic: "Build discussion for current playtesters. Anything here is unreleased. Do not post it elsewhere."

  - name: DEV
    channels:
      - name: devlog
        type: announcement
        overwrites: readonly_reactable
        topic: "How {{game}} gets made. Other dev servers can Follow this channel, which is free reach."

      - name: ask-the-dev
        type: forum
        overwrites: forum_open
        topic: |
          Ask anything. Posts stay browsable, so check whether it has been
          answered before you open a new one.
        default_auto_archive_duration: 10080
        tags:
          - { name: design, emoji: "📐" }
          - { name: tech, emoji: "⚙️" }
          - { name: art, emoji: "🎨" }
          - { name: roadmap, emoji: "🗺️" }
          - { name: business, emoji: "💼" }
          - { name: answered, emoji: "💬", moderated: true }

  - name: OFF-TOPIC
    channels:
      - name: off-topic
        type: text
        overwrites: open
        default: true
        topic: "Anything that is not {{game}}."

      - name: other-games
        type: text
        overwrites: open_no_links
        topic: "What else you are playing."

  - name: VOICE
    channels:
      - name: General Voice
        type: voice
        overwrites: voice_open

      - name: Co-op and Raids
        type: voice
        overwrites: voice_open

  - name: STAFF
    channels:
      - name: mod-log
        type: text
        overwrites: staff_only
        topic: "AutoMod alerts, Sapphire logging, Wick alerts, Steward warnings. Also the safety alerts channel."

      - name: server-updates
        type: text
        overwrites: staff_only
        required: true
        required_when: community
        required_reason: "Community mode will not turn on without a mod-only updates channel."
        topic: "Discord's community updates channel. Required by Community mode. Discord posts here, you do not."

      - name: steward-reports
        type: text
        overwrites: staff_only
        content_file: content/steward-reports.md
        pin: true
        topic: "Weekly cohort digest, decay alerts, onboarding funnel numbers. Steward posts here."

# Channels shown to every new member during onboarding.
# Discord requires at least 7 defaults, of which at least 5 must let
# @everyone both view AND send. Counted below: 8 defaults, 5 of them open.
onboarding_defaults:
  - start-here
  - rules
  - announcements
  - general
  - screenshots
  - hero-showcase
  - tower-talk
  - off-topic

# ---------------------------------------------------------------------------
# Onboarding prompts
# ---------------------------------------------------------------------------
onboarding_prompts:

  - title: "What brings you to {{game}}?"
    type: multiple_choice
    single_select: false
    required: true
    options:
      - title: "Climbing the tower"
        description: "Floor progression, comps, the wall you are stuck on."
        emoji: "🗼"
        roles: [Tower Climber]
        channels: [tower-talk]
      - title: "Guilds and other players"
        description: "Raids, trade, finding people to run with."
        emoji: "🛡️"
        roles: [Guild Seeker]
        channels: [looking-for-guild]
      - title: "Breaking things"
        description: "You find bugs and you enjoy it."
        emoji: "🐛"
        roles: [Bug Hunter]
        channels: [bug-reports]
      - title: "The world and the writing"
        description: "Lore, art, how it all got made."
        emoji: "📜"
        roles: [Lore Reader]
        channels: [devlog]

  # This prompt is the entire proactive layer's legal basis. Discord's
  # Developer Policy prohibits unsolicited DMs. An opt-in role is the only
  # compliant path for reaching people, and it is a better product anyway:
  # visible, revocable, and it does not read as spam.
  - title: "Want a ping when a playtest opens?"
    note: "The opt-in that makes every later announcement compliant. Keep this one."
    type: multiple_choice
    single_select: true
    required: true
    options:
      - title: "Yes, ping me"
        description: "A role mention in #announcements when builds go out. A few times a month at most."
        emoji: "🔔"
        roles: [Ping Me For Playtests]
      - title: "No thanks"
        description: "You can add this later from the Channels and Roles menu."
        emoji: "🔕"
        roles: []
        # Discord rejects an answer that grants neither a role nor a channel.
        # Pointing at a channel they already see is the harmless way to say
        # "this answer does nothing".
        channels: [general]

  # Attribution you cannot get any other way. Server Insights does not unlock
  # until 500 members and its attribution is coarse even then. Three seconds
  # from the member, and it tells you which channel is actually working.
  - title: "How did you find us?"
    note: "Attribution you cannot get any other way. Server Insights needs 500 members and is coarse even then."
    type: dropdown
    single_select: true
    required: true
    options:
      - { title: "Steam", emoji: "🎮", roles: [Found via Steam] }
      - { title: "A friend", emoji: "👋", roles: [Found via a Friend] }
      - { title: "A streamer or video", emoji: "📺", roles: [Found via a Creator] }
      - { title: "Reddit", emoji: "👽", roles: [Found via Reddit] }
      - { title: "Another Discord server", emoji: "💬", roles: [Found via Another Server] }
      - { title: "Somewhere else", emoji: "🧭", roles: [Found via Elsewhere] }

# ---------------------------------------------------------------------------
# AutoMod
#
# Hard API limits: 6 keyword rules, 10 regex patterns per rule at 260 chars
# each (Rust regex, no lookahead or backreferences), 1 spam rule,
# 1 keyword-preset rule, 1 mention-spam rule, 1 member-profile rule.
# Timeout as an action only works on keyword and mention-spam rules.
# ---------------------------------------------------------------------------
automod:

  - name: "Slurs and sexual content"
    note: "Discord's own maintained word lists. Nothing for you to write or update."
    trigger: keyword_preset
    presets: [sexual_content, slurs]
    allow_list: []
    actions:
      - block: "That was caught by the server's content filter."
      - alert: mod-log
    exempt_roles: []

  - name: "Spam"
    trigger: spam
    actions:
      - block: "That looked like spam to the server filter."
      - alert: mod-log
    exempt_roles: [Dev, Admin, Mod]

  - name: "Mention spam"
    note: "Blocks messages with more than 6 mentions and times the sender out for 10 minutes."
    trigger: mention_spam
    mention_total_limit: 6
    mention_raid_protection: true
    actions:
      - block: "Too many mentions in one message."
      - alert: mod-log
      - timeout: 600
    exempt_roles: [Dev, Admin, Mod]

  - name: "Invite links and advertising"
    note: "Exempts #looking-for-guild, where recruiters legitimately post links."
    trigger: keyword
    regex_patterns:
      - '(discord\.(gg|io|me|li)|discordapp\.com/invite)/[a-zA-Z0-9-]+'
      - '(?i)(free\s+nitro|steam\s+gift|claim\s+your\s+reward)'
    keyword_filter: []
    allow_list: []
    actions:
      - block: "Invite links and advertising are not allowed here. Ask a mod if you think this is a mistake."
      - alert: mod-log
      - timeout: 300
    exempt_roles: [Dev, Admin, Mod]
    # #looking-for-guild is where guild recruiters legitimately post links.
    exempt_channels: [looking-for-guild]

  # Note: Discord's preset filters (profanity, sexual content, slurs) are only
  # available on the keyword_preset trigger, which applies to messages. Member
  # profiles support keyword and regex matching only, so this rule targets
  # staff impersonation and giveaway scams, which is what nickname abuse in a
  # game server actually looks like.
  - name: "Nickname and profile filter"
    trigger: member_profile
    event: member_update
    keyword_filter:
      - "*giveaway*"
      - "*free nitro*"
      - "*steam gift*"
    regex_patterns:
      - '(?i)^\W*({{game}}\s+)?(mod|admin|moderator|staff|support|dev)\W*$'
    allow_list: []
    actions:
      - block_member_interaction: true
    exempt_roles: [Dev, Admin, Mod]

# ---------------------------------------------------------------------------
# The steps no API can perform.
#
# Everything that Discord exposes an endpoint for is done automatically. What
# is left is genuinely client-only, plus installing other bots, which is a
# permission flow needing a human to press Authorize.
#
# This lives here rather than in code so you can edit it, and so a blueprint
# for a different community can carry its own list. The setup page reads it
# fresh every time, so changes show up without restarting anything.
# ---------------------------------------------------------------------------
manual_steps:

  - kind: setting
    title: "Rules Screening"
    why: >-
      Makes every new member tick a box agreeing to the rules before they can
      post. The long version is already posted and pinned in your rules
      channel; this is the short version Discord shows at the door. There is no
      endpoint for it, so this is the one piece with real typing.
    where:
      - "Click your server name at the top left"
      - "Server Settings, then Safety Setup"
      - "Rules Screening, then Set Up Rules Screening"
      - "Paste one rule per box. Each block below is a title on the first line and its description underneath."
      - "Save. 16 is Discord's maximum and there are exactly 16 here."
    copy_file: content/rules-screening.md
    copy_label: "Copy all 16 rules"
    after: >-
      Edit content/rules-screening.md to change these, and content/rules.md for
      the long version in the channel. Keep the two in step.

  - kind: setting
    title: "Server Guide"
    why: >-
      The checklist a new member sees on their first visit. Different from the
      welcome screen, which is already set for you. Worth five minutes: it is
      the difference between someone posting and someone lurking.
    where:
      - "Server name at the top left, Server Settings"
      - "Onboarding, then the Server Guide tab"
      - "Under New Member To-Dos, add your welcome channel, your general chat, and your bug channel"
      - "Give each one a line saying what to DO there, not what it is"
      - "Under Resources, add your rules and announcements channels"
      - "Save Changes"
    after: "Keep the to-dos to three. A checklist of ten reads as homework."

  - kind: setting
    title: "Raid Protection and DM filtering"
    why: >-
      Raid protection spots join floods and makes new arrivals solve a CAPTCHA
      for an hour. The DM filter scans direct messages from other members for
      scams, which is the most common way a small server gets hurt. Neither has
      an endpoint.
    where:
      - "Server name at the top left, Server Settings, Safety Setup"
      - "Turn on Raid Protection"
      - "Set Direct Message Spam Filter to Filter All Messages"
      - "Check the alerts channel is pointed at your mod channel"
    after: "Turn these on before you invite anyone, not after the first raid."

  - kind: setting
    title: "Give yourself the top role"
    why: >-
      The roles exist but Discord will not assign one to you. Until you do
      this, nothing marks you as staff and your name shows in the default
      colour.
    where:
      - "Server name at the top left, Server Settings, Members"
      - "Find yourself in the list"
      - "Press the + next to your name and pick your staff role"
      - "While you are here, drag the bot's own role to just underneath it"
    after: >-
      Moving the bot's role up is what lets this tool order the rest of the
      roles for you. A bot cannot move anything above itself, so if the run
      said it skipped ordering, this is the fix.

  - kind: setting
    title: "Make an invite link that does not expire"
    why: >-
      Discord's default invite dies after 7 days, which is how servers end up
      with a dead link on their store page and no idea why nobody joins.
    where:
      - "Right-click your general channel, then Invite People"
      - "Click Edit invite link"
      - "Set Expire After to Never and Max Number of Uses to No Limit"
      - "Generate a New Link and keep it somewhere you will find it again"

  - kind: bot
    title: "Wick"
    why: >-
      Security. Anti-nuke, CAPTCHA verification, and a join gate that filters
      brand-new and avatarless accounts. The one bot worth installing before
      you have members rather than after.
    where:
      - "Click your server name at the top left"
      - "App Directory"
      - "Search for Wick"
      - "Add to Server, pick your server, Authorize"
    after: >-
      Set its join gate to reject accounts under 7 days old and point its
      logging at your mod channel. Leave its automod off; yours is already
      configured and two filters fighting is worse than one.

  - kind: bot
    title: "Sapphire"
    why: >-
      Moderation, reaction roles and logging. Genuinely free, and it covers
      what MEE6 charges for.
    where:
      - "Server name at the top left"
      - "App Directory"
      - "Search for Sapphire"
      - "Add to Server, pick your server, Authorize"
    after: >-
      Point its logging at your mod channel. Skip its join-role feature, the
      new-member questions already handle roles.

  - kind: bot
    title: "Statbot"
    optional: true
    why: >-
      Charts and member counters. Its free tier keeps only 30 days of history,
      which is exactly why the ledger exists alongside it.
    where:
      - "Server name at the top left"
      - "App Directory"
      - "Search for Statbot"
      - "Add to Server, pick your server, Authorize"

  - kind: bot
    title: "Steamy"
    optional: true
    why: >-
      Posts new Steam reviews and weekly rating digests into Discord. Install
      it the day {{game}} has a Steam page, and not before.
    where:
      - "Server name at the top left"
      - "App Directory"
      - "Search for Steamy"
      - "Add to Server, pick your server, Authorize"
    after: >-
      Point it at your patch notes channel rather than announcements. Reviews
      are a steady drip and announcements should stay rare enough to matter.
